name: Deploy FANPLAY prototype to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare public files
        run: |
          site="$RUNNER_TEMP/fanplay-pages"
          mkdir -p "$site/snapshots"
          cp index.html "$site/"
          cp -R pages css js "$site/"
          for version in 2026-11-06-fanplay 2026-11-10-fanplay-mobile; do
            mkdir -p "$site/snapshots/$version"
            cp -R "snapshots/$version/index.html" "snapshots/$version/css" "snapshots/$version/js" "$site/snapshots/$version/"
          done
      - name: Upload website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/fanplay-pages
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
