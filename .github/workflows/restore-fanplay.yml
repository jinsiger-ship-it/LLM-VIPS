name: Restore original FANPLAY v1.1 prototype
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-fanplay.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Reconstruct exactly from uploaded FANPLAY source
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const zlib = require('zlib');
          const crypto = require('crypto');
          const parts = Array.from({length:7}, (_,i) =>
            fs.readFileSync('.github/fanplay-source/part'+(i+1)+'.txt','utf8').trim()
          ).join('');
          const source = zlib.brotliDecompressSync(Buffer.from(parts,'base64')).toString('utf8');
          const digest = crypto.createHash('sha256').update(source).digest('hex');
          const expected = '0bd40a795b0384f349385dd0c091d1860c84ac13b511474e2c86b032e52f3f3f';
          if (digest !== expected) throw new Error('Original-source hash mismatch: '+digest);
          const style = source.match(/<style>([\s\S]*?)<\/style>/);
          const script = source.match(/<script>([\s\S]*?)<\/script>/);
          if (!style || !script) throw new Error('Missing original style/script');
          fs.mkdirSync('css',{recursive:true});
          fs.mkdirSync('jss',{recursive:true});
          fs.mkdirSync('pages/wireframe',{recursive:true});
          fs.writeFileSync('css/style.css',style[1]);
          fs.writeFileSync('jss/app.js',script[1]);
          function page(base) {
            return source
              .replace(/<style>[\s\S]*?<\/style>/,
                '<link rel="stylesheet" href="'+base+'css/style.css">')
              .replace(/<script>[\s\S]*?<\/script>/,
                '<script src="'+base+'jss/app.js" defer></script>');
          }
          const rootPage = page('');
          const weekPage = page('../../');
          fs.writeFileSync('index.html',rootPage);
          fs.writeFileSync('inex.html',rootPage);
          fs.writeFileSync('pages/wireframe/10week_wireframe',weekPage);
          fs.writeFileSync('pages/wireframe/10week_wireframe.html',weekPage);
          console.log('Restored original FANPLAY v1.1 SHA256:',digest);
          NODE
      - name: Replace wrong prototype and remove staging files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html inex.html css/style.css jss/app.js pages/wireframe/10week_wireframe pages/wireframe/10week_wireframe.html
          git rm -r .github/fanplay-source .github/fanplay-source-check.txt
          git commit -m "Replace incorrect prototype with original FANPLAY v1.1"
          git push
